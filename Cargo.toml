[package]
name = "irohole"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
iroh = {version="0.92.0", features=["discovery-local-network"]} 
rand = "0.9.2"
tokio = {version= "1.47.1", features=["sync"]}
tracing-subscriber = { version = "0.3", default-features = false, features = ["alloc", "ansi"] }
tracing = "0.1"
bincode = { version = "2.0.1", features = ["serde"] }
